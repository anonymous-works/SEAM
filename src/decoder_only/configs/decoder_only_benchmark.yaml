gpu: "0"
output_root: "../../../runs/decoder_only"
data_root: "../../seam/datasets"
model_order:
  - qwen3_0_6b
  - qwen3_1_7b
  - qwen3_4b
  - llama3_3b
dataset_order:
  - pubmed
  - arxiv
  - booksum
  - govreport

defaults:
  model:
    local_files_only: true
    trust_remote_code: true
    torch_dtype: bfloat16
    eval_torch_dtype: bfloat16
    attn_implementation: sdpa
    gradient_checkpointing: true
    use_cache: false
  training:
    num_train_epochs: 4
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 32
    learning_rate: 3.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_epsilon: 1.0e-8
    warmup_ratio: 0.05
    weight_decay: 0.01
    max_grad_norm: 1.0
    bf16: true
    fp16: false
    tf32: true
    gradient_checkpointing: true
    optim: adamw_torch_fused
    dataloader_num_workers: 4
    dataloader_persistent_workers: true
    dataloader_prefetch_factor: 2
    length_bucketing: true
    logging_steps: 1
    seed: 42
  generation:
    batch_size: 4
    max_new_tokens: 512
    min_new_tokens: 32
    num_beams: 1
    do_sample: false
    temperature: 0.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.05
    no_repeat_ngram_size: 3
  data:
    source_field: text
    target_field: summary
    id_field: id
    prompt_suffix: ""
    clean_text: true

models:
  qwen3_0_6b:
    model_id: Qwen/Qwen3-0.6B
    path_env: QWEN3_0_6B_PATH
    local_dir: Qwen3-0.6B
    training:
      per_device_train_batch_size: 16
      gradient_accumulation_steps: 2
    training_by_dataset:
      pubmed:
        num_train_epochs: 3
        per_device_train_batch_size: 32
        gradient_accumulation_steps: 2
      arxiv:
        num_train_epochs: 2
        per_device_train_batch_size: 24
        gradient_accumulation_steps: 4
      booksum:
        num_train_epochs: 4
        per_device_train_batch_size: 16
        gradient_accumulation_steps: 4
      govreport:
        num_train_epochs: 3
        per_device_train_batch_size: 16
        gradient_accumulation_steps: 4
    generation:
      batch_size: 64
  qwen3_1_7b:
    model_id: Qwen/Qwen3-1.7B
    path_env: QWEN3_1_7B_PATH
    local_dir: Qwen3-1.7B
    training:
      per_device_train_batch_size: 12
      gradient_accumulation_steps: 4
    training_by_dataset:
      pubmed:
        num_train_epochs: 3
        per_device_train_batch_size: 16
        gradient_accumulation_steps: 4
      arxiv:
        num_train_epochs: 2
        per_device_train_batch_size: 12
        gradient_accumulation_steps: 4
      booksum:
        num_train_epochs: 4
        per_device_train_batch_size: 8
        gradient_accumulation_steps: 6
      govreport:
        num_train_epochs: 3
        per_device_train_batch_size: 8
        gradient_accumulation_steps: 6
    generation:
      batch_size: 32
  qwen3_4b:
    model_id: Qwen/Qwen3-4B
    path_env: QWEN3_4B_PATH
    local_dir: Qwen3-4B
    training:
      per_device_train_batch_size: 12
      gradient_accumulation_steps: 4
    training_by_dataset:
      pubmed:
        num_train_epochs: 3
        per_device_train_batch_size: 12
        gradient_accumulation_steps: 4
      arxiv:
        num_train_epochs: 2
        per_device_train_batch_size: 8
        gradient_accumulation_steps: 4
      booksum:
        num_train_epochs: 4
        per_device_train_batch_size: 4
        gradient_accumulation_steps: 8
      govreport:
        num_train_epochs: 3
        per_device_train_batch_size: 4
        gradient_accumulation_steps: 8
    generation:
      batch_size: 32
  llama3_3b:
    model_id: meta-llama/Llama-3.2-3B-Instruct
    path_env: LLAMA3_3B_PATH
    local_dir: Llama-3.2-3B-Instruct
    training:
      per_device_train_batch_size: 16
      gradient_accumulation_steps: 4
    training_by_dataset:
      pubmed:
        num_train_epochs: 3
        per_device_train_batch_size: 16
        gradient_accumulation_steps: 4
      arxiv:
        num_train_epochs: 2
        per_device_train_batch_size: 12
        gradient_accumulation_steps: 4
      booksum:
        num_train_epochs: 4
        per_device_train_batch_size: 8
        gradient_accumulation_steps: 6
      govreport:
        num_train_epochs: 3
        per_device_train_batch_size: 8
        gradient_accumulation_steps: 6
    generation:
      batch_size: 32

datasets:
  pubmed:
    data_dir: pubmed
    source_prefix: "Summarize the following biomedical research article into a concise, factual abstract. Preserve the key objective, methods, results, and conclusion; do not add information.\nArticle:\n"
    max_source_length: 4096
    max_target_length: 512
    max_sequence_length: 8192
    generation:
      batch_size_by_model:
        qwen3_0_6b: 256
        qwen3_1_7b: 256
        qwen3_4b: 128
        llama3_3b: 128
  arxiv:
    data_dir: arxiv
    source_prefix: "Summarize the following scientific research article into a concise, factual abstract. Preserve the key objective, methods, results, and conclusion; do not add information.\nArticle:\n"
    max_source_length: 8096
    max_target_length: 512
    max_sequence_length: 9216
    generation:
      batch_size_by_model:
        qwen3_0_6b: 128
        qwen3_1_7b: 128
        qwen3_4b: 64
        llama3_3b: 64
  booksum:
    data_dir: booksum
    source_prefix: "Summarize the following literary narrative into a coherent, faithful summary. Preserve the main characters, key events, causal and temporal relationships, and important outcomes; do not add information.\nNarrative:\n"
    max_source_length: 12288
    max_target_length: 1024
    max_sequence_length: 13312
    generation:
      max_new_tokens: 1024
      batch_size_by_model:
        qwen3_0_6b: 64
        qwen3_1_7b: 64
        qwen3_4b: 32
        llama3_3b: 32
  govreport:
    data_dir: govreport
    source_prefix: "Summarize the following government report into a concise, factual summary. Preserve the main objectives, findings, evidence, and recommendations; do not add information.\nReport:\n"
    max_source_length: 12288
    max_target_length: 1024
    max_sequence_length: 13312
    generation:
      max_new_tokens: 1024
      batch_size_by_model:
        qwen3_0_6b: 64
        qwen3_1_7b: 64
        qwen3_4b: 32
        llama3_3b: 32
