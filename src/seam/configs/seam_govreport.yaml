_base_: seam_base.yaml

experiment:
  name: seam_govreport
  output_dir: runs/seam/govreport_full_memory_source_copy

data:
  train_file: datasets/govreport/train.jsonl
  validation_file: datasets/govreport/validation.jsonl
  test_file: datasets/govreport/test.jsonl
  source_field: text
  target_field: summary
  id_field: id
  encoder_prefix: "Summarize the following government report into a concise, factual summary. Preserve the main objectives, findings, evidence, and recommendations; do not add information.\nReport:\n"
  decoder_prompt: "Write a concise, factual summary of the encoded government report. Preserve the main objectives, findings, evidence, and recommendations when supported. Do not add unsupported information. Output only the summary."
  decoder_prefix: "Summary:\n"
  detokenize: true
  max_source_length: 12288
  max_target_length: 1024

generation:
  batch_size: 8
  max_new_tokens: 1024
  min_new_tokens: 32
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3
  num_beams: 1
  do_sample: false
  temperature: 0.0
  top_k: 0
  top_p: 1.0

model:
  encoder_name: perplexity-ai/pplx-embed-v1-0.6b
  decoder_name: Qwen/Qwen3-0.6B

training:
  interface_warmup_epochs: 0
  full_finetune_epochs: 3
  batch_size: 24
  gradient_accumulation_steps: 2
  validation_batch_size: 24
  num_workers: 8
  validation_num_workers: 2
  length_bucketing: true
  length_bucket_multiplier: 50
  persistent_workers: true
  fused_optimizer: true
  tf32: true
  max_grad_norm: 1.0
  save_best: false
